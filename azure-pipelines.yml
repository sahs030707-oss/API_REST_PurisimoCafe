trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  proyectoApi: 'PurisimoCafe.API/PurisimoCafe.API.csproj'
  proyectoBD: 'PurisimoCafeDB/PurisimoCafeDB.sqlproj'

stages:
- stage: Build
  displayName: 'Compilación de API y Base de Datos'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    # Proyecto 1: la API
    - task: DotNetCoreCLI@2
      displayName: 'Publicar la API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(proyectoApi)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: true

    # Proyecto 2: la base de datos (genera el .dacpac)
    - task: VSBuild@1
      displayName: 'Compilar proyecto de base de datos'
      inputs:
        solution: '$(proyectoBD)'
        configuration: '$(buildConfiguration)'

    - task: CopyFiles@2
      displayName: 'Copiar el archivo .dacpac'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**/bin/$(buildConfiguration)/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/dacpac'
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefactos'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'