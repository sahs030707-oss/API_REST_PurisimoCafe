trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  proyectoApi: 'PurisimoCafe.API/PurisimoCafe.API.csproj'
  proyectoBD: 'PurisimoCafeDB/PurisimoCafeDB.sqlproj'

stages:
- stage: Build
  displayName: 'Compilación de API y Base de Datos'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Publicar la API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(proyectoApi)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: true

    - task: VSBuild@1
      displayName: 'Compilar proyecto de base de datos'
      inputs:
        solution: '$(proyectoBD)'
        configuration: '$(buildConfiguration)'

    - task: CopyFiles@2
      displayName: 'Copiar el archivo .dacpac'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**/bin/$(buildConfiguration)/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/dacpac'
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefactos'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Despliegue a Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar artefactos'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: SqlAzureDacpacDeployment@1
      displayName: 'Desplegar base de datos (.dacpac)'
      inputs:
        azureSubscription: 'conexion-azure-api'
        AuthenticationType: 'server'
        ServerName: 'sql-purisimocafe.database.windows.net'
        DatabaseName: 'PurisimoCafeDB'
        SqlUsername: '$(SqlUsuario)'
        SqlPassword: '$(SqlPassword)'
        deployType: 'DacpacTask'
        DeploymentAction: 'Publish'
        DacpacFile: '$(System.ArtifactsDirectory)/drop/dacpac/PurisimoCafeDB.dacpac'

    - task: AzureWebApp@1
      displayName: 'Desplegar API en App Service'
      inputs:
        azureSubscription: 'conexion-azure-api'
        appType: 'webApp'
        appName: 'purisimocafe-api'
        package: '$(System.ArtifactsDirectory)/drop/api/*.zip'